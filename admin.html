<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Earth Token — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--leaf:#3FA34D;--bad:#FF6B57;--ink:#173A2C;--card:#fff;--shadow:0 4px 20px rgba(0,0,0,.1);--font:'Fredoka',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:#F0F7F2;color:var(--ink);min-height:100vh;padding-bottom:40px;}
  .topbar{background:var(--ink);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:12px;}
  .topbar h1{font-size:20px;font-weight:700;}
  .topbar .badge{background:var(--bad);font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;}
  .wrap{max-width:700px;margin:0 auto;padding:24px 18px;}
  /* Login */
  .login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px;}
  .login h2{font-size:24px;font-weight:700;}
  .login input{width:280px;border:2px solid #ddd;border-radius:12px;padding:13px;font-family:var(--font);font-size:16px;}
  .login input:focus{outline:none;border-color:var(--leaf);}
  .login button{width:280px;background:var(--leaf);color:#fff;border:none;border-radius:12px;padding:14px;font-family:var(--font);font-weight:700;font-size:16px;cursor:pointer;}
  .login .err{color:var(--bad);font-size:14px;font-weight:600;}
  /* Tabs */
  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab{border:none;background:var(--card);border-radius:12px;padding:10px 18px;font-family:var(--font);font-weight:600;font-size:14px;cursor:pointer;box-shadow:var(--shadow);opacity:.6;}
  .tab.active{opacity:1;background:var(--leaf);color:#fff;}
  .view{display:none;} .view.active{display:block;}
  /* Cards */
  .row{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;}
  .row-main{flex:1;}
  .row-name{font-size:15px;font-weight:700;}
  .row-sub{font-size:12.5px;opacity:.6;font-weight:500;margin-top:2px;}
  .pts-pos{color:var(--leaf);font-weight:700;font-size:14px;}
  .pts-neg{color:var(--bad);font-weight:700;font-size:14px;}
  .btn-del{background:#FFF0EE;border:none;border-radius:10px;padding:8px 14px;font-family:var(--font);font-weight:700;font-size:13px;color:var(--bad);cursor:pointer;}
  .btn-warn{background:#FFF6E5;border:none;border-radius:10px;padding:8px 14px;font-family:var(--font);font-weight:700;font-size:13px;color:#B7820A;cursor:pointer;}
  .btn-del:active,.btn-warn:active{transform:scale(.97);}
  /* Feed cards */
  .fcard{background:var(--card);border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;}
  .fcard img{width:100%;max-height:220px;object-fit:cover;display:block;}
  .fcard-no-photo{height:60px;background:#F3FBEF;display:flex;align-items:center;justify-content:center;font-size:30px;}
  .fcard-body{padding:12px 14px;display:flex;align-items:center;gap:10px;}
  .fcard-info{flex:1;}
  .fcard-user{font-size:14px;font-weight:700;}
  .fcard-act{font-size:13px;opacity:.7;font-weight:500;}
  .fcard-time{font-size:12px;opacity:.45;}
  /* Warn form */
  .warn-form{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:20px;}
  .warn-form h3{font-size:16px;font-weight:700;margin-bottom:12px;}
  .warn-form select,.warn-form textarea{width:100%;border:2px solid #E3EFE6;border-radius:12px;padding:11px;font-family:var(--font);font-size:14px;color:var(--ink);margin-bottom:10px;}
  .warn-form textarea{min-height:80px;resize:none;}
  .warn-form select:focus,.warn-form textarea:focus{outline:none;border-color:var(--leaf);}
  .warn-form button{background:#F5A623;color:#fff;border:none;border-radius:12px;padding:12px 20px;font-family:var(--font);font-weight:700;font-size:14px;cursor:pointer;}
  /* History */
  .wrow{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border-left:4px solid #F5A623;}
  .wrow.read{border-color:#ccc;opacity:.6;}
  .wrow-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .wrow-user{font-size:14px;font-weight:700;}
  .wrow-time{font-size:12px;opacity:.5;margin-left:auto;}
  .wrow-msg{font-size:13.5px;font-weight:500;}
  .empty{text-align:center;padding:24px;opacity:.5;font-size:14px;}
  .status{font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;margin-top:8px;display:inline-block;}
  .status.ok{background:#DDF4E4;color:#1a6b32;} .status.err{background:#FFE3DE;color:#c0392b;}
</style>
</head>
<body>

<div class="topbar">
  <h1>🌍 Earth Token</h1>
  <span class="badge">ADMIN</span>
</div>

<!-- LOGIN SCREEN -->
<div class="wrap" id="loginScreen">
  <div class="login">
    <h2>🔐 Teacher login</h2>
    <input type="password" id="pwInput" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')checkPassword()"/>
    <button onclick="checkPassword()">Sign in</button>
    <span class="err" id="pwErr" style="display:none">Wrong password. Try again.</span>
  </div>
</div>

<!-- ADMIN PANEL (hidden until login) -->
<div class="wrap" id="adminPanel" style="display:none">
  <div class="tabs">
    <button class="tab active" onclick="showTab('users',this)">👥 Users</button>
    <button class="tab" onclick="showTab('feed',this)">📸 Feed</button>
    <button class="tab" onclick="showTab('warnings',this)">⚠️ Warnings</button>
  </div>

  <div class="view active" id="tab-users">
    <div id="usersList"><div class="empty">Loading users…</div></div>
  </div>

  <div class="view" id="tab-feed">
    <div id="feedList"><div class="empty">Loading feed…</div></div>
  </div>

  <div class="view" id="tab-warnings">
    <div class="warn-form">
      <h3>⚠️ Send a warning to a student</h3>
      <select id="warnUser"><option value="">— pick a student —</option></select>
      <textarea id="warnMsg" placeholder="Type your message here. The student will see this as a pop-up the next time they open the app."></textarea>
      <button onclick="sendWarning()">Send warning</button>
      <span class="status" id="warnStatus" style="display:none"></span>
    </div>
    <h3 style="font-size:15px;font-weight:700;margin-bottom:12px;">📋 Warning history</h3>
    <div id="warnHistory"><div class="empty">No warnings sent yet.</div></div>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, addDoc, deleteDoc, collection, query, orderBy, limit, onSnapshot, getDocs }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDlyxgrUmz0_NLDphRrzvOVcYl9PViAzAc",
    authDomain: "earth-token-62b31.firebaseapp.com",
    projectId: "earth-token-62b31",
    storageBucket: "earth-token-62b31.firebasestorage.app",
    messagingSenderId: "7396616782",
    appId: "1:7396616782:web:4b4a49bae4a2009414711f"
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const db  = getFirestore(app);

  window.ADMIN_DB = {
    subscribeScores(cb){
      return onSnapshot(query(collection(db,"scores"),orderBy("points","desc")),
        snap=>cb(snap.docs.map(d=>({id:d.id,...d.data()}))));
    },
    async deleteUser(id){
      await deleteDoc(doc(db,"scores",id));
    },
    subscribeFeed(cb){
      return onSnapshot(query(collection(db,"feed"),orderBy("timestamp","desc"),limit(60)),
        snap=>cb(snap.docs.map(d=>({id:d.id,...d.data()}))));
    },
    async deleteFeedItem(id){ await deleteDoc(doc(db,"feed",id)); },
    async sendWarning(username,message){
      await addDoc(collection(db,"warnings"),{username:username.toLowerCase(),message,timestamp:Date.now(),read:false});
    },
    subscribeWarnings(cb){
      return onSnapshot(query(collection(db,"warnings"),orderBy("timestamp","desc"),limit(50)),
        snap=>cb(snap.docs.map(d=>({id:d.id,...d.data()}))));
    }
  };
  if(window.onDBReady) window.onDBReady();
  window.DB_READY=true;
</script>

<script>
  // ↓↓↓ SET YOUR ADMIN PASSWORD HERE ↓↓↓
  const ADMIN_PASSWORD = "EarthToken2026";
  // ↑↑↑ SET YOUR ADMIN PASSWORD HERE ↑↑↑

  let userNames=[];
  let unsubUsers=null, unsubFeed=null, unsubWarnings=null;

  function checkPassword(){
    const pw=document.getElementById("pwInput").value;
    if(pw===ADMIN_PASSWORD){
      document.getElementById("loginScreen").style.display="none";
      document.getElementById("adminPanel").style.display="block";
      initAdmin();
    } else {
      document.getElementById("pwErr").style.display="block";
      document.getElementById("pwInput").value="";
    }
  }
  window.checkPassword=checkPassword;

  function initAdmin(){
    if(!window.ADMIN_DB){ setTimeout(initAdmin,500); return; }
    loadUsers(); loadFeed(); loadWarnings();
  }
  window.onDBReady=function(){ if(document.getElementById("adminPanel").style.display!=="none") initAdmin(); };

  function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago";}

  function loadUsers(){
    unsubUsers=window.ADMIN_DB.subscribeScores(rows=>{
      userNames=rows.map(r=>r.name);
      updateWarnSelect();
      const el=document.getElementById("usersList");
      if(!rows.length){el.innerHTML='<div class="empty">No users yet.</div>';return;}
      el.innerHTML=rows.map(r=>{
        const ptsCls=r.points<0?"pts-neg":"pts-pos";
        const sign=r.points>0?"+":"";
        return `<div class="row">
          <div class="row-main">
            <div class="row-name">${r.name}</div>
            <div class="row-sub ${ptsCls}">${sign}${r.points} lifetime pts</div>
          </div>
          <button class="btn-warn" onclick="openWarnFor('${r.name}')">⚠️ Warn</button>
          <button class="btn-del" onclick="deleteUser('${r.id}','${r.name}')">🗑 Remove</button>
        </div>`;
      }).join("");
    });
  }

  function loadFeed(){
    unsubFeed=window.ADMIN_DB.subscribeFeed(items=>{
      const el=document.getElementById("feedList");
      if(!items.length){el.innerHTML='<div class="empty">No posts yet.</div>';return;}
      el.innerHTML=items.map(item=>{
        const photo=item.photo?`<img src="${item.photo}" alt="photo"/>`:`<div class="fcard-no-photo">${item.emoji}</div>`;
        const ptsCls=item.pts>0?"pts-pos":"pts-neg", sign=item.pts>0?"+":"";
        return `<div class="fcard">
          ${photo}
          <div class="fcard-body">
            <div class="fcard-info">
              <div class="fcard-user">${item.username||"?"} · ${item.emoji} ${item.activityName}</div>
              <div class="fcard-act ${ptsCls}">${sign}${item.pts} pts</div>
              <div class="fcard-time">${timeAgo(item.timestamp)}</div>
            </div>
            <button class="btn-del" onclick="deleteFeed('${item.id}')">🗑 Remove</button>
          </div>
        </div>`;
      }).join("");
    });
  }

  function loadWarnings(){
    unsubWarnings=window.ADMIN_DB.subscribeWarnings(items=>{
      updateWarnSelect();
      const el=document.getElementById("warnHistory");
      if(!items.length){el.innerHTML='<div class="empty">No warnings sent yet.</div>';return;}
      el.innerHTML=items.map(w=>`
        <div class="wrow ${w.read?'read':''}">
          <div class="wrow-top">
            <span class="wrow-user">@${w.username}</span>
            ${w.read?'<span style="font-size:11px;color:#aaa">✓ seen</span>':'<span style="font-size:11px;color:#F5A623;font-weight:700">● unread</span>'}
            <span class="wrow-time">${timeAgo(w.timestamp)}</span>
          </div>
          <div class="wrow-msg">${w.message}</div>
        </div>`).join("");
    });
  }

  function updateWarnSelect(){
    const sel=document.getElementById("warnUser");
    const cur=sel.value;
    sel.innerHTML='<option value="">— pick a student —</option>'+userNames.map(n=>`<option value="${n}">${n}</option>`).join("");
    if(cur) sel.value=cur;
  }

  async function deleteUser(id,name){
    if(!confirm(`Remove user "${name}"? Their score will be deleted. This cannot be undone.`)) return;
    try{ await window.ADMIN_DB.deleteUser(id); }
    catch(e){ alert("Error: "+e.message); }
  }

  async function deleteFeed(id){
    if(!confirm("Remove this post from the feed?")) return;
    try{ await window.ADMIN_DB.deleteFeedItem(id); }
    catch(e){ alert("Error: "+e.message); }
  }

  function openWarnFor(name){
    showTab('warnings', document.querySelectorAll('.tab')[2]);
    document.getElementById("warnUser").value=name;
    document.getElementById("warnMsg").focus();
  }

  async function sendWarning(){
    const username=document.getElementById("warnUser").value;
    const message=(document.getElementById("warnMsg").value||"").trim();
    const status=document.getElementById("warnStatus");
    if(!username){showStatus("Please pick a student.","err");return;}
    if(message.length<3){showStatus("Please type a message.","err");return;}
    try{
      await window.ADMIN_DB.sendWarning(username,message);
      document.getElementById("warnMsg").value="";
      document.getElementById("warnUser").value="";
      showStatus("Warning sent! They'll see it next time they open the app.","ok");
    }catch(e){showStatus("Error: "+e.message,"err");}
  }

  function showStatus(msg,type){
    const s=document.getElementById("warnStatus");
    s.textContent=msg; s.className="status "+type; s.style.display="inline-block";
    setTimeout(()=>s.style.display="none",3500);
  }

  function showTab(t,btn){
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
    document.getElementById("tab-"+t).classList.add("active");
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
  }

  window.deleteUser=deleteUser; window.deleteFeed=deleteFeed;
  window.sendWarning=sendWarning; window.showTab=showTab; window.openWarnFor=openWarnFor;
  if(window.DB_READY) initAdmin();
</script>
</body>
</html>
