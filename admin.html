<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Earth Token — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--leaf:#3FA34D;--bad:#FF6B57;--ink:#173A2C;--card:#fff;--shadow:0 4px 20px rgba(0,0,0,.1);--font:'Fredoka',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:#F0F7F2;color:var(--ink);min-height:100vh;padding-bottom:60px;}

.topbar{background:var(--ink);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
.topbar h1{font-size:19px;font-weight:700;flex:1;}
.topbar .badge{background:var(--bad);font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;}

.wrap{max-width:720px;margin:0 auto;padding:22px 16px;}

/* Login */
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:14px;}
.login h2{font-size:22px;font-weight:700;}
.login input{width:280px;border:2px solid #ddd;border-radius:12px;padding:12px;font-family:var(--font);font-size:15px;}
.login input:focus{outline:none;border-color:var(--leaf);}
.login button{width:280px;background:var(--leaf);color:#fff;border:none;border-radius:12px;padding:13px;font-family:var(--font);font-weight:700;font-size:15px;cursor:pointer;}
.login .err{color:var(--bad);font-size:13.5px;font-weight:600;}

/* Tabs */
.tabs{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap;}
.tab{border:none;background:var(--card);border-radius:11px;padding:10px 16px;font-family:var(--font);font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:var(--shadow);opacity:.6;}
.tab.active{opacity:1;background:var(--leaf);color:#fff;}
.view{display:none;}.view.active{display:block;}

/* Bulk action bar */
.bulk-bar{position:sticky;top:55px;z-index:9;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:10px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);}
.bulk-bar.show{display:flex;}
.bulk-bar .sel-count{flex:1;font-size:14px;font-weight:600;}
.bulk-del-btn{background:var(--bad);border:none;color:#fff;border-radius:10px;padding:8px 16px;font-family:var(--font);font-weight:700;font-size:13.5px;cursor:pointer;}
.bulk-del-btn:active{transform:scale(.97);}
.bulk-clear{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:10px;padding:8px 12px;font-family:var(--font);font-weight:600;font-size:13px;cursor:pointer;}

/* Select-all bar */
.sel-all-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:8px 4px;}
.sel-all-bar label{font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;}
.sel-all-bar input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:var(--bad);}

/* User rows */
.row{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;transition:background .15s;}
.row.selected{background:#FFF0EE;outline:2px solid var(--bad);}
.row-cb{width:18px;height:18px;cursor:pointer;accent-color:var(--bad);flex-shrink:0;}
.row-main{flex:1;min-width:0;}
.row-name{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-sub{font-size:12px;opacity:.6;font-weight:500;margin-top:1px;}
.pts-pos{color:var(--leaf);font-weight:700;}
.pts-neg{color:var(--bad);font-weight:700;}
.btn-del{background:#FFF0EE;border:none;border-radius:9px;padding:7px 12px;font-family:var(--font);font-weight:700;font-size:12.5px;color:var(--bad);cursor:pointer;white-space:nowrap;}
.btn-warn{background:#FFF6E5;border:none;border-radius:9px;padding:7px 12px;font-family:var(--font);font-weight:700;font-size:12.5px;color:#B7820A;cursor:pointer;white-space:nowrap;}
.btn-hide{background:#F5F5F5;border:none;border-radius:8px;padding:6px 8px;font-size:15px;cursor:pointer;}
.btn-del:active,.btn-warn:active{transform:scale(.97);}

/* Feed cards */
.fcard{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;transition:outline .1s;}
.fcard.selected{outline:2px solid var(--bad);}
.fcard img{width:100%;max-height:200px;object-fit:cover;display:block;}
.fcard-no-photo{height:54px;background:#F3FBEF;display:flex;align-items:center;justify-content:center;font-size:28px;}
.fcard-body{padding:10px 13px;display:flex;align-items:center;gap:9px;}
.fcard-cb{width:18px;height:18px;cursor:pointer;accent-color:var(--bad);flex-shrink:0;}
.fcard-info{flex:1;min-width:0;}
.fcard-user{font-size:13.5px;font-weight:700;}
.fcard-act{font-size:12.5px;opacity:.7;font-weight:500;}
.fcard-time{font-size:11.5px;opacity:.4;}

/* Warn form */
.warn-form{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:18px;}
.warn-form h3{font-size:15px;font-weight:700;margin-bottom:11px;}
.warn-form select,.warn-form textarea{width:100%;border:2px solid #E3EFE6;border-radius:11px;padding:10px;font-family:var(--font);font-size:13.5px;color:var(--ink);margin-bottom:9px;}
.warn-form textarea{min-height:78px;resize:none;}
.warn-form select:focus,.warn-form textarea:focus{outline:none;border-color:var(--leaf);}
.warn-form button{background:#F5A623;color:#fff;border:none;border-radius:11px;padding:11px 18px;font-family:var(--font);font-weight:700;font-size:13.5px;cursor:pointer;}

/* Warning history */
.wrow{background:var(--card);border-radius:13px;padding:11px 13px;margin-bottom:7px;box-shadow:var(--shadow);border-left:4px solid #F5A623;}
.wrow.read{border-color:#ccc;opacity:.55;}
.wrow-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.wrow-user{font-size:13.5px;font-weight:700;}
.wrow-time{font-size:11.5px;opacity:.45;margin-left:auto;}
.wrow-msg{font-size:13px;font-weight:500;}

.empty{text-align:center;padding:22px;opacity:.45;font-size:13.5px;}
.comment-admin-section{padding:8px 13px 10px;border-top:1px solid #EEF4EF;}
.toggle-comments-btn{border:none;background:#F2F6F3;border-radius:8px;padding:6px 12px;font-family:var(--font);font-weight:600;font-size:12px;cursor:pointer;color:#173A2C;opacity:.75;}
.admin-comments{margin-top:8px;}
.admin-comment-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #EEF4EF;}
.admin-comment-row:last-child{border-bottom:none;}
.acr-user{font-size:12px;font-weight:700;color:#173A2C;min-width:60px;}
.acr-text{flex:1;font-size:12.5px;font-weight:500;opacity:.85;}
.status{font-size:13px;font-weight:600;padding:7px 11px;border-radius:9px;margin-top:7px;display:inline-block;}
.status.ok{background:#DDF4E4;color:#1a6b32;}.status.err{background:#FFE3DE;color:#c0392b;}

/* Section header */
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.sec-head h3{font-size:15px;font-weight:700;flex:1;}
.sec-head .count-badge{background:#E8F0E8;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;color:#2E7D32;}
</style>
</head>
<body>

<div class="topbar">
  <h1>🌍 Earth Token</h1>
  <span class="badge">ADMIN</span>
</div>

<!-- LOGIN -->
<div class="wrap" id="loginScreen">
  <div class="login">
    <h2>🌍 Earth Token Admin</h2>
    <p style="font-size:14px;opacity:.6;font-weight:500;text-align:center;">Teacher dashboard</p>
    <button onclick="checkPassword()" style="margin-top:8px;">Sign in as Teacher</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="wrap" id="adminPanel" style="display:none">
  <div class="tabs">
    <button class="tab active" onclick="showTab('users',this)">👥 Users</button>
    <button class="tab" onclick="showTab('feed',this)">📸 Feed</button>
    <button class="tab" onclick="showTab('warnings',this)">⚠️ Warnings</button>
  </div>

  <!-- USERS TAB -->
  <div class="view active" id="tab-users">
    <!-- Bulk action bar (appears when items selected) -->
    <div class="bulk-bar" id="userBulkBar">
      <span class="sel-count" id="userSelCount">0 selected</span>
      <button class="bulk-clear" onclick="clearUserSelection()">✕ Clear</button>
      <button class="bulk-del-btn" onclick="bulkDeleteUsers()">🗑 Delete selected</button>
    </div>
    <div class="sel-all-bar">
      <label><input type="checkbox" id="userSelectAll" onchange="toggleSelectAllUsers(this)"/> Select all</label>
    </div>
    <div id="usersList"><div class="empty">Loading users…</div></div>
  </div>

  <!-- FEED TAB -->
  <div class="view" id="tab-feed">
    <div class="bulk-bar" id="feedBulkBar">
      <span class="sel-count" id="feedSelCount">0 selected</span>
      <button class="bulk-clear" onclick="clearFeedSelection()">✕ Clear</button>
      <button class="bulk-del-btn" onclick="bulkDeleteFeed()">🗑 Delete selected</button>
    </div>
    <div class="sel-all-bar">
      <label><input type="checkbox" id="feedSelectAll" onchange="toggleSelectAllFeed(this)"/> Select all</label>
    </div>
    <div id="feedList"><div class="empty">Loading feed…</div></div>
  </div>

  <!-- WARNINGS TAB -->
  <div class="view" id="tab-warnings">
    <div class="warn-form">
      <h3>⚠️ Send a warning to a student</h3>
      <select id="warnUser"><option value="">— pick a student —</option></select>
      <textarea id="warnMsg" placeholder="Type your message. The student sees this as a pop-up next time they open the app."></textarea>
      <button onclick="sendWarning()">Send warning</button>
      <span class="status" id="warnStatus" style="display:none"></span>
    </div>
    <div class="sec-head"><h3>📋 Warning history</h3></div>
    <div id="warnHistory"><div class="empty">No warnings sent yet.</div></div>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, addDoc, deleteDoc, collection, query, orderBy, limit, where, onSnapshot, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const CFG={apiKey:"AIzaSyDlyxgrUmz0_NLDphRrzvOVcYl9PViAzAc",authDomain:"earth-token-62b31.firebaseapp.com",
  projectId:"earth-token-62b31",storageBucket:"earth-token-62b31.firebasestorage.app",
  messagingSenderId:"7396616782",appId:"1:7396616782:web:4b4a49bae4a2009414711f"};
const app=initializeApp(CFG),db=getFirestore(app);

window.ADMIN_DB={
  subscribeScores(cb){return onSnapshot(query(collection(db,"scores"),orderBy("points","desc")),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))));},
  async deleteUser(id){await deleteDoc(doc(db,"scores",id));},
  async bulkDeleteUsers(ids){
    // Firestore batch: max 500 per batch
    const chunks=[];for(let i=0;i<ids.length;i+=499)chunks.push(ids.slice(i,i+499));
    for(const chunk of chunks){const b=writeBatch(db);chunk.forEach(id=>b.delete(doc(db,"scores",id)));await b.commit();}
  },
  subscribeFeed(cb){return onSnapshot(query(collection(db,"feed"),orderBy("timestamp","desc"),limit(80)),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))));},
  async deleteFeedItem(id){await deleteDoc(doc(db,"feed",id));},
  async bulkDeleteFeed(ids){
    const chunks=[];for(let i=0;i<ids.length;i+=499)chunks.push(ids.slice(i,i+499));
    for(const chunk of chunks){const b=writeBatch(db);chunk.forEach(id=>b.delete(doc(db,"feed",id)));await b.commit();}
  },
  subscribeComments(postId,cb){
    return onSnapshot(query(collection(db,"feedComments"),where("postId","==",postId),limit(30)),
      s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))));
  },
  async deleteComment(id){await deleteDoc(doc(db,"feedComments",id));},
  async toggleHide(id,hidden){await setDoc(doc(db,"scores",id),{hidden:!hidden},{merge:true});},
  async sendWarning(username,message){await addDoc(collection(db,"warnings"),{username:username.toLowerCase(),message,timestamp:Date.now(),read:false});},
  subscribeWarnings(cb){return onSnapshot(query(collection(db,"warnings"),orderBy("timestamp","desc"),limit(60)),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))));},
};
if(window.onDBReady)window.onDBReady();
window.DB_READY=true;
</script>

<script>
const ADMIN_PASSWORD="EarthToken2026";

let userNames=[];
let allUserRows=[];   // [{id, name, points}]
let allFeedRows=[];   // [{id, ...}]
let selectedUsers=new Set();
let selectedFeed=new Set();
let unsubUsers=null,unsubFeed=null,unsubWarnings=null;

function checkPassword(){
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("adminPanel").style.display="block";
  initAdmin();
}
window.checkPassword=checkPassword;

function initAdmin(){if(!window.ADMIN_DB){setTimeout(initAdmin,500);return;}loadUsers();loadFeed();loadWarnings();}
window.onDBReady=function(){if(document.getElementById("adminPanel").style.display!=="none")initAdmin();};

function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago";}

/* ===== USERS ===== */
function loadUsers(){
  unsubUsers=window.ADMIN_DB.subscribeScores(rows=>{
    allUserRows=rows;
    userNames=rows.map(r=>r.name);
    updateWarnSelect();
    renderUsers();
  });
}

function renderUsers(){
  const el=document.getElementById("usersList");
  if(!allUserRows.length){el.innerHTML='<div class="empty">No users yet.</div>';updateUserBulkBar();return;}
  el.innerHTML=allUserRows.map(r=>{
    const ptsCls=r.points<0?"pts-neg":"pts-pos",sign=r.points>0?"+":"";
    const checked=selectedUsers.has(r.id)?"checked":"";
    return `<div class="row ${selectedUsers.has(r.id)?"selected":""}" id="urow-${r.id}">
      <input type="checkbox" class="row-cb" ${checked} onchange="toggleUserSel('${r.id}',this)"/>
      <div class="row-main">
        <div class="row-name">${r.name}${r.hidden?' <span style="font-size:11px;background:#FFE0E0;color:#C00;border-radius:6px;padding:2px 6px;font-weight:700;">hidden</span>':''}</div>
        <div class="row-sub ${ptsCls}">${sign}${r.points} lifetime pts</div>
      </div>
      <button class="btn-hide" title="${r.hidden?'Show on leaderboard':'Hide from leaderboard'}" onclick="toggleHide('${r.id}',${!!r.hidden})">${r.hidden?'🙈':'👁️'}</button>
      <button class="btn-warn" onclick="openWarnFor('${r.name}')">⚠️ Warn</button>
      <button class="btn-del" onclick="deleteSingleUser('${r.id}','${r.name}')">🗑</button>
    </div>`;
  }).join("");
  updateUserBulkBar();
  document.getElementById("userSelectAll").checked=selectedUsers.size===allUserRows.length&&allUserRows.length>0;
}

function toggleUserSel(id,cb){
  if(cb.checked)selectedUsers.add(id);else selectedUsers.delete(id);
  const row=document.getElementById("urow-"+id);
  if(row)row.classList.toggle("selected",cb.checked);
  updateUserBulkBar();
  document.getElementById("userSelectAll").checked=selectedUsers.size===allUserRows.length&&allUserRows.length>0;
}
function toggleSelectAllUsers(cb){
  if(cb.checked)allUserRows.forEach(r=>selectedUsers.add(r.id));
  else selectedUsers.clear();
  renderUsers();
}
function clearUserSelection(){selectedUsers.clear();renderUsers();}
function updateUserBulkBar(){
  const bar=document.getElementById("userBulkBar");
  const n=selectedUsers.size;
  bar.classList.toggle("show",n>0);
  document.getElementById("userSelCount").textContent=`${n} user${n>1?"s":""} selected`;
}

async function deleteSingleUser(id,name){
  if(!confirm(`Remove "${name}"? Cannot be undone.`))return;
  selectedUsers.delete(id);
  try{await window.ADMIN_DB.deleteUser(id);}catch(e){alert("Error: "+e.message);}
}

async function bulkDeleteUsers(){
  const ids=[...selectedUsers];
  if(!ids.length)return;
  const names=allUserRows.filter(r=>ids.includes(r.id)).map(r=>r.name).join(", ");
  if(!confirm(`Delete ${ids.length} user${ids.length>1?"s":""}?\n\n${names}\n\nThis cannot be undone.`))return;
  try{
    await window.ADMIN_DB.bulkDeleteUsers(ids);
    selectedUsers.clear();
    renderUsers();
  }catch(e){alert("Error: "+e.message);}
}

/* ===== FEED ===== */
function loadFeed(){
  unsubFeed=window.ADMIN_DB.subscribeFeed(items=>{
    allFeedRows=items;
    renderFeed();
  });
}

function renderFeed(){
  const el=document.getElementById("feedList");
  if(!allFeedRows.length){el.innerHTML='<div class="empty">No posts yet.</div>';updateFeedBulkBar();return;}
  el.innerHTML=allFeedRows.map(item=>{
    const photo=item.photo?`<img src="${item.photo}" alt="photo"/>`:`<div class="fcard-no-photo">${item.emoji}</div>`;
    const ptsCls=item.pts>0?"pts-pos":"pts-neg",sign=item.pts>0?"+":"";
    const checked=selectedFeed.has(item.id)?"checked":"";
    return `<div class="fcard ${selectedFeed.has(item.id)?"selected":""}" id="frow-${item.id}">
      ${photo}
      <div class="fcard-body">
        <input type="checkbox" class="fcard-cb" ${checked} onchange="toggleFeedSel('${item.id}',this)"/>
        <div class="fcard-info">
          <div class="fcard-user">${item.username||"?"} · ${item.emoji} ${item.activityName}</div>
          <div class="fcard-act ${ptsCls}">${sign}${item.pts} pts · ${timeAgo(item.timestamp)}</div>
        </div>
        <button class="btn-del" onclick="deleteSingleFeed('${item.id}')">🗑 Post</button>
      </div>
      <div class="comment-admin-section">
        <button class="toggle-comments-btn" onclick="toggleAdminComments('${item.id}',this)">💬 View comments</button>
        <div class="admin-comments" id="ac-${item.id}" style="display:none">
          <div class="admin-comment-list" id="acl-${item.id}"><div style="font-size:12px;opacity:.5;padding:6px">Loading…</div></div>
        </div>
      </div>
    </div>`;
  }).join("");
  updateFeedBulkBar();
  document.getElementById("feedSelectAll").checked=selectedFeed.size===allFeedRows.length&&allFeedRows.length>0;
}

let commentUnsubs={};
function toggleAdminComments(postId,btn){
  const section=document.getElementById("ac-"+postId);
  const open=section.style.display==="none";
  section.style.display=open?"block":"none";
  btn.textContent=open?"💬 Hide comments":"💬 View comments";
  if(open) loadAdminComments(postId);
  else if(commentUnsubs[postId]){commentUnsubs[postId]();delete commentUnsubs[postId];}
}
function loadAdminComments(postId){
  if(commentUnsubs[postId]){commentUnsubs[postId]();delete commentUnsubs[postId];}
  const list=document.getElementById("acl-"+postId);
  if(!list||!window.ADMIN_DB) return;
  commentUnsubs[postId]=window.ADMIN_DB.subscribeComments(postId,comments=>{
    if(!comments.length){list.innerHTML='<div style="font-size:12px;opacity:.5;padding:6px">No comments on this post.</div>';return;}
    list.innerHTML=comments.map(c=>`
      <div class="admin-comment-row">
        <div class="acr-user">${c.username||"?"}</div>
        <div class="acr-text">${c.text}</div>
        <button class="btn-del" style="font-size:11px;padding:4px 8px;white-space:nowrap" onclick="deleteComment('${c.id}')">🗑 Delete</button>
      </div>`).join("");
  });
}
async function deleteComment(commentId){
  if(!confirm("Delete this comment? Cannot be undone.")) return;
  try{await window.ADMIN_DB.deleteComment(commentId);}
  catch(e){alert("Error: "+e.message);}
}
window.toggleAdminComments=toggleAdminComments;
window.deleteComment=deleteComment;

function toggleFeedSel(id,cb){
  if(cb.checked)selectedFeed.add(id);else selectedFeed.delete(id);
  const card=document.getElementById("frow-"+id);
  if(card)card.classList.toggle("selected",cb.checked);
  updateFeedBulkBar();
  document.getElementById("feedSelectAll").checked=selectedFeed.size===allFeedRows.length&&allFeedRows.length>0;
}
function toggleSelectAllFeed(cb){
  if(cb.checked)allFeedRows.forEach(r=>selectedFeed.add(r.id));
  else selectedFeed.clear();
  renderFeed();
}
function clearFeedSelection(){selectedFeed.clear();renderFeed();}
function updateFeedBulkBar(){
  const bar=document.getElementById("feedBulkBar");
  const n=selectedFeed.size;
  bar.classList.toggle("show",n>0);
  document.getElementById("feedSelCount").textContent=`${n} post${n>1?"s":""} selected`;
}

async function deleteSingleFeed(id){
  if(!confirm("Remove this post? Cannot be undone."))return;
  selectedFeed.delete(id);
  try{await window.ADMIN_DB.deleteFeedItem(id);}catch(e){alert("Error: "+e.message);}
}

async function bulkDeleteFeed(){
  const ids=[...selectedFeed];
  if(!ids.length)return;
  if(!confirm(`Delete ${ids.length} post${ids.length>1?"s":""}? This cannot be undone.`))return;
  try{
    await window.ADMIN_DB.bulkDeleteFeed(ids);
    selectedFeed.clear();
    renderFeed();
  }catch(e){alert("Error: "+e.message);}
}

/* ===== WARNINGS ===== */
function loadWarnings(){
  unsubWarnings=window.ADMIN_DB.subscribeWarnings(items=>{
    updateWarnSelect();
    const el=document.getElementById("warnHistory");
    if(!items.length){el.innerHTML='<div class="empty">No warnings sent yet.</div>';return;}
    el.innerHTML=items.map(w=>`
      <div class="wrow ${w.read?"read":""}">
        <div class="wrow-top">
          <span class="wrow-user">@${w.username}</span>
          ${w.read?'<span style="font-size:11px;color:#aaa">✓ seen</span>':'<span style="font-size:11px;color:#F5A623;font-weight:700">● unread</span>'}
          <span class="wrow-time">${timeAgo(w.timestamp)}</span>
        </div>
        <div class="wrow-msg">${w.message}</div>
      </div>`).join("");
  });
}

function updateWarnSelect(){
  const sel=document.getElementById("warnUser");
  const cur=sel.value;
  sel.innerHTML='<option value="">— pick a student —</option>'+userNames.map(n=>`<option value="${n}">${n}</option>`).join("");
  if(cur)sel.value=cur;
}

async function sendWarning(){
  const username=document.getElementById("warnUser").value;
  const message=(document.getElementById("warnMsg").value||"").trim();
  if(!username){showStatus("Please pick a student.","err");return;}
  if(message.length<3){showStatus("Please type a message.","err");return;}
  try{
    await window.ADMIN_DB.sendWarning(username,message);
    document.getElementById("warnMsg").value="";document.getElementById("warnUser").value="";
    showStatus("Warning sent! They'll see it next time they open the app.","ok");
  }catch(e){showStatus("Error: "+e.message,"err");}
}

function showStatus(msg,type){
  const s=document.getElementById("warnStatus");s.textContent=msg;s.className="status "+type;s.style.display="inline-block";
  setTimeout(()=>s.style.display="none",3500);
}

function openWarnFor(name){
  showTab("warnings",document.querySelectorAll(".tab")[2]);
  document.getElementById("warnUser").value=name;
  document.getElementById("warnMsg").focus();
}

function showTab(t,btn){
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
  document.getElementById("tab-"+t).classList.add("active");
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
}

window.deleteSingleUser=deleteSingleUser;window.bulkDeleteUsers=bulkDeleteUsers;

async function toggleHide(id,currentlyHidden){
  try{
    await window.ADMIN_DB.toggleHide(id,currentlyHidden);
  }catch(e){alert("Error: "+e.message);}
}
